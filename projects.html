<main><div class="container page-head"><p class="eyebrow">04 / PROJECTS</p><h2>Selected Work</h2><p>Only the two projects requested from the GitHub portfolio are featured here.</p></div>
<div class="container content"><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="web">Web Development</button><button class="filter" data-filter="algo">Programming / Algorithms</button></div>
<div id="projectGrid" class="grid two"></div></div></main>
<script>
const projects=[
{title:"Animal Website",cat:"web",desc:"An interactive animal awareness website built to spread awareness about animals, encourage volunteering at animal shelters, and provide an engaging user experience.",tech:["HTML","CSS","JavaScript"],url:"https://github.com/vidyakeerthichitturi/Animal-Website"},
{title:"SpeedSort Analyzer",cat:"algo",desc:"A sorting algorithm performance analyzer comparing Bubble Sort and Merge Sort, helping users understand algorithmic performance and complexity.",tech:["Python","Algorithms","Data Structures"],url:"https://github.com/vidyakeerthichitturi/SpeedSort-Analyzer"}];
function render(f){projectGrid.innerHTML=projects.filter(p=>f==="all"||p.cat===f).map(p=>`<article class="card project"><span class="tag">${p.cat==="web"?"Web Development":"Programming / Algorithms"}</span><h3>${p.title}</h3><p>${p.desc}</p><div>${p.tech.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="links"><a class="link" target="_blank" href="${p.url}">View on GitHub ↗</a></div></article>`).join("")}
render("all");document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.filter)});
</script><footer><div class="container footer-inner"><span>© 2026 Vidya Keerthi Chitturi</span><span>Developer | Software Engineer · Hyderabad</span></div></footer><script src="script.js"></script></body></html>
